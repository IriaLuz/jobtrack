# Local PostgreSQL for development and integration tests: `docker compose up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    ports:
      # 5433 on your machine, so it never clashes with another PostgreSQL already using 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created.
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
